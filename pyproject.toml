[project]
name = "repo-probe"
version = "0.1.0"
description = "Lightweight CLI that clones a Python repo, detects its test setup, runs tests in Docker, and reports structured results."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repo_probe*"]